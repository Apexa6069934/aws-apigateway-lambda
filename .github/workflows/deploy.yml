name: Deploy CDK Application

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - staging

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.9'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'production' || 'staging' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-CDKDeploy
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Install dependencies
        run: |
          npm ci
          pip install -r lambda/requirements.txt || echo "No requirements.txt found, skipping Python dependencies"

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Build TypeScript
        run: npm run build

      - name: Run CDK synth
        run: cdk synth

      - name: Run CDK diff (PR only)
        if: github.event_name == 'pull_request'
        run: |
          cdk diff 2>&1 | tee cdk-diff.txt
          # Comment the diff on the PR
          if [ -s cdk-diff.txt ]; then
            echo "CDK_DIFF<<EOF" >> $GITHUB_ENV
            cat cdk-diff.txt >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Comment CDK diff on PR
        if: github.event_name == 'pull_request' && env.CDK_DIFF
        uses: actions/github-script@v7
        with:
          script: |
            const diff = process.env.CDK_DIFF;
            if (diff) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### CDK Diff\n\`\`\`\n${diff}\n\`\`\``
              });
            }

      - name: Run CDK deploy
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        run: |
          cdk deploy --require-approval never --all
        env:
          CDK_DEPLOY_ACCOUNT: ${{ secrets.CDK_DEPLOY_ACCOUNT }}
          CDK_DEPLOY_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Upload CDK outputs
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cdk-outputs
          path: |
            cdk.out/
            *.json
          retention-days: 30

      - name: Notify deployment status
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful to ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' ? 'production' : 'staging' }}"
          else
            echo "❌ Deployment failed"
            exit 1
          fi